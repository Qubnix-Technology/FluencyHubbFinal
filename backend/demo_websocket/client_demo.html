<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FluencyHub Pure PHP WebSocket Live Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .demo-card { width: 100%; max-width: 650px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; height: 580px; }
    .demo-header { padding: 16px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
    .demo-header h2 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status-badge { font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: #ef4444; color: #fff; }
    .status-badge.connected { background: #10b981; }
    .config-bar { padding: 10px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; gap: 10px; font-size: 0.85rem; align-items: center; flex-wrap: wrap; }
    .config-bar input, .config-bar select { background: #0f172a; border: 1px solid #475569; color: #fff; padding: 6px 10px; border-radius: 6px; outline: none; font-size: 0.85rem; }
    .chat-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; background: #0b1120; }
    .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg-bubble.mine { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
    .msg-bubble.other { align-self: flex-start; background: #1e293b; border: 1px solid #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
    .msg-meta { font-size: 0.72rem; opacity: 0.75; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
    .role-tag { font-size: 0.65rem; padding: 1px 5px; border-radius: 4px; font-weight: 700; text-transform: uppercase; background: rgba(255,255,255,0.2); }
    .system-msg { align-self: center; font-size: 0.75rem; color: #94a3b8; background: rgba(255,255,255,0.06); padding: 4px 12px; border-radius: 12px; }
    .chat-footer { padding: 14px 20px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 10px; }
    .chat-footer input { flex: 1; background: #1e293b; border: 1px solid #475569; border-radius: 8px; color: #fff; padding: 10px 14px; font-size: 0.92rem; outline: none; }
    .chat-footer button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 0 20px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .chat-footer button:hover { background: #1d4ed8; }
    .note { margin-top: 14px; font-size: 0.8rem; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="demo-card">
    <header class="demo-header">
      <h2>⚡ FluencyHub Pure PHP WebSocket Demo</h2>
      <span id="statusBadge" class="status-badge">Connecting...</span>
    </header>

    <div class="config-bar">
      <label>My Name:</label>
      <input type="text" id="nameInput" value="Student Alex" />
      <label>Role:</label>
      <select id="roleSelect">
        <option value="Student">Student</option>
        <option value="Teacher">Teacher</option>
        <option value="Admin">Admin</option>
      </select>
      <span id="onlineCount" style="margin-left: auto; color: #38bdf8; font-weight: 600;">Online: 1</span>
    </div>

    <div class="chat-body" id="chatBody"></div>

    <form class="chat-footer" id="chatForm">
      <input type="text" id="msgInput" placeholder="Type a message and press Enter..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <p class="note">Open this page in 2 different browser tabs to test instantaneous, live bi-directional messaging with zero database polling!</p>

  <script>
    let ws = null;
    const chatBody = document.getElementById('chatBody');
    const statusBadge = document.getElementById('statusBadge');
    const nameInput = document.getElementById('nameInput');
    const roleSelect = document.getElementById('roleSelect');
    const msgInput = document.getElementById('msgInput');
    const chatForm = document.getElementById('chatForm');
    const onlineCount = document.getElementById('onlineCount');

    function connect() {
      const host = window.location.hostname || '127.0.0.1';
      ws = new WebSocket('ws://' + host + ':8085');

      ws.onopen = () => {
        statusBadge.textContent = 'Live Connected';
        statusBadge.className = 'status-badge connected';
      };

      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.type === 'system') {
            appendSystemMessage(data.text, data.time);
            if (data.online_count) onlineCount.textContent = 'Online: ' + data.online_count;
          } else if (data.type === 'chat') {
            appendChatMessage(data);
          }
        } catch (err) {
          console.error(err);
        }
      };

      ws.onclose = () => {
        statusBadge.textContent = 'Disconnected';
        statusBadge.className = 'status-badge';
        setTimeout(connect, 3000);
      };

      ws.onerror = (err) => {
        console.warn('WebSocket error:', err);
      };
    }

    function appendSystemMessage(text, time) {
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.textContent = `${text} (${time || ''})`;
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function appendChatMessage(data) {
      const isMine = data.sender === nameInput.value;
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + (isMine ? 'mine' : 'other');

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `<strong>${data.sender}</strong> <span class="role-tag">${data.role}</span> <span>${data.time}</span>`;

      const text = document.createElement('div');
      text.textContent = data.message;

      bubble.appendChild(meta);
      bubble.appendChild(text);
      chatBody.appendChild(bubble);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = msgInput.value.trim();
      if (!val || !ws || ws.readyState !== WebSocket.OPEN) return;

      const payload = {
        sender: nameInput.value || 'Anonymous',
        role: roleSelect.value,
        message: val
      };

      ws.send(JSON.stringify(payload));
      msgInput.value = '';
    });

    connect();
  </script>
</body>
</html>
